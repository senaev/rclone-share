name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen create-dmg

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (Release, ad-hoc signed)
        run: bash scripts/build.sh

      - name: Verify the Share Extension is embedded and signed
        run: bash scripts/verify.sh build/out/RcloneShare.app

      - name: Package DMG
        run: bash scripts/package.sh build/out/RcloneShare.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RcloneShare-dmg
          path: "*.dmg"
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" ./*.dmg --generate-notes
